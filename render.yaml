services:
  # Python Digital Twin Backend (FastAPI + WebSockets)
  - type: web
    name: ev-digital-twin-backend
    runtime: python
    rootDir: digital-twin
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12

  # React Frontend (Vite Static Site)
  - type: static_site
    name: ev-hmi-dashboard-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
